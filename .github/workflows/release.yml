name: Release

# On a v* tag: build the wheel and create a GitHub Release with the CHANGELOG section,
# the wheel and the demo MP4 attached. Nothing is published to PyPI or npm (plan §9).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != pyproject $version"; exit 1; }
      - name: Build wheel
        run: pip install uv && uv build --wheel
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/extract-changelog.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.whl assets/demo/demo.mp4 \
            --title "ReelHive $GITHUB_REF_NAME" --notes-file notes.md
