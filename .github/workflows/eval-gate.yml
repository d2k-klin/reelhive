name: Eval gate

# Prompt changes must not regress the core eval set by more than 5% (plan §7).
# Runs the real graphs in spec-only mode against Claude: no video, no paid images.
on:
  pull_request:
    paths:
      - "src/reelhive/agents/prompts/**"
      - "evals/rubrics/**"
      - "evals/datasets/**"
      - "evals/baselines/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require the API key (a gate must not pass by being skipped)
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not available (forks cannot run the eval gate; a maintainer must)."
            exit 1
          fi
      - run: pip install uv && uv sync --all-extras --frozen
      - run: uv run playwright install --with-deps chromium
      - name: Core set vs baseline
        run: uv run reelhive eval --providers claude --set core --judge claude --baseline evals/baselines/claude-core.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-report
          path: |
            evals/reports/*/report.md
            evals/reports/*/report.html
            evals/reports/*/results.json
