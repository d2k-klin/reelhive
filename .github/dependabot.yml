version: 2

updates:
  - package-ecosystem: "pip"  # pyproject.toml / uv.lock
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"  # renderer workspace
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"  # keeps SHA pins fresh
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: ["ci", "dependencies"]
    open-pull-requests-limit: 10
