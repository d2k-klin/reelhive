version: 2

updates:
  - package-ecosystem: "pip"  # pyproject.toml / uv.lock
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"  # renderer + ui workspaces, one lockfile
    directory: "/"
    schedule:
      interval: "weekly"
    groups:  # these only work when they move together
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      ag-ui:
        patterns: ["@ag-ui/*", "@copilotkit/*"]
      vite:
        patterns: ["vite", "vitest", "@vitejs/*", "@tailwindcss/vite"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"  # keeps SHA pins fresh
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: ["ci", "dependencies"]
    open-pull-requests-limit: 10
