storyline: Onboarding is a checklist nobody owns. Ramp-Up gives every new hire a clear
  first month.
features:
- Day-by-day plans per role
- Automatic account requests to IT
- Buddy matching
- Thirty-day pulse surveys
duration: 90
closing: See Ramp-Up in action at rampup.work
